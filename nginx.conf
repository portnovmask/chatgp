events {}

http {
    include       mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;

        server_name localhost;

        # 1. Статические файлы: js, css, img — отдаёт напрямую
        location /static/ {
            alias /app/static/;
            autoindex off;
        }

        # 2. Прокси доступ ко всем остальным маршрутам на FastAPI
        location / {
            proxy_pass http://web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 3. /image-preview/ → через FastAPI (не отдаём напрямую /tmp)
        location /tmp/ {
            return 403;
        }

        location /image-preview/ {
            proxy_pass http://web:8000;
            proxy_set_header Host $host;
        }
    }
}
