<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>401 - Ошибка авторизации</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #e6f7f4;
            opacity: 0.8;
            background-image: radial-gradient(#144a24 0.5px, #e6f7f4 0.5px);
            background-size: 10px 10px;
            /* background: linear-gradient(135deg, #2a3602, #5a922d); */
            color: green;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
        }
        h1 {
            font-size: 5rem;
            margin-bottom: 10px;
        }
        p {
            font-size: 1.2rem;
            margin-bottom: 20px;
        }
        a {
            display: inline-block;
            padding: 12px 24px;
            background: white;
            color: #2a3602;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            transition: 0.3s;
        }
        a:hover {
            background: #ddd;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>401</h1>
        <p>Вы не авторизованы!</p>
        <p>Это происходит, когда вам нужно авторизоваться, чтобы просматривать эту страницу.</p>
            <p>Это всё равно, что прийти на вечеринку без приглашения.</p>
        <a href="/">Вернуться домой и автризорваться.</a>
    </div>
</body>
</html>
