<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Оплата подписки {{ pretty_name }}</title>
</head>
<body>
    <h2>Оплата подписки "{{ pretty_name }}"</h2>
    <p>Отсканируйте QR-код или перейдите по ссылке:</p>
    <img src="data:image/png;base64,{{ qr_base64 }}" alt="QR-код">
    <p><a href="{{ payment_url }}" target="_blank">Перейти к оплате</a></p>

    <form action="/ton/verify-payment/?level={{ level }}" method="post">
        <button type="submit">Я оплатил</button>
    </form>
</body>
</html>
