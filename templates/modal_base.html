<dialog id="modal-feedback" class="modal info">
  <article>
    <button class="close-button" aria-label="Закрыть" onclick="closeModal(this.closest('dialog'))" style="position:absolute; top:1rem; right:1rem; background:none; border:none; font-size:1.2rem; cursor:pointer;">✕</button>
    <h3>Сообщение</h3>
    <div class="modal-actions" style="margin-top: 1rem;"></div>
  </article>
</dialog>

<style>
  dialog {
    max-width: 500px;
    width: auto;
    padding: 2rem;
    border: none;

    position: relative;
  }
  dialog article h3 {
    margin-top: 0;
    text-wrap: pretty;
    margin-bottom: 1rem;

        width: 80%;
        /*margin-top: 10px;*/

        height: 45px;
        border: none;
        cursor: pointer;
  }

  dialog.success article {
